name: Deploy via SSH

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: SSH and Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            # 1. Ensure directory exists and clone repo if missing
            if [ ! -d "/opt/apps/staging/Docubot/.git" ]; then
              echo "Directory not found or missing .git. Setting up repository..."
              mkdir -p /opt/apps/staging
              cd /opt/apps/staging
              git clone https://github.com/Amenawajiha/docubot.git Docubot
            fi

            # 2. Pull latest changes
            cd /opt/apps/staging/Docubot
            git pull origin main

            # 3. Build & start containers using Docker Compose v2 syntax
            docker compose up -d --build
