
name: CI/CD Pipeline

on:
  push:
    branches: [ "my-work1-branch" ]
  pull_request:
    branches: [ "main" ]
  # Allows manually triggering the workflow from the Actions tab
  workflow_dispatch:

jobs:
  backend-ci:
    name: Backend Test & Lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./docubot-backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run Pytest
        run: uv run pytest


