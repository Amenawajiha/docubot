name: docubot-platform-dev

services:
  frontend:
    build:
      context: ./docubot-frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8001/api/v1}
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-http://localhost:8001}
    # container_name: docubot-frontend-dev (Namespaced by COMPOSE_PROJECT_NAME)
    restart: always
    ports:
      - "${FRONTEND_PORT:-8091}:3000"
    env_file:
      - path: ./docubot-frontend/.env
        required: false
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8001/api/v1}
      NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-http://localhost:8001}
    networks:
      - dev-network

  backend:
    build:
      context: ./docubot-backend
      dockerfile: Dockerfile
    # container_name: docubot-backend-dev (Namespaced by COMPOSE_PROJECT_NAME)
    restart: always
    ports:
      - "${BACKEND_PORT:-8001}:8001"
    env_file:
      - path: ./docubot-backend/.env
        required: false
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
      LOG_FORMAT: ${LOG_FORMAT:-console}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-docubot}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-docubot}}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${REDIS_URL:-redis://redis:6379/1}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      S3_EXTERNAL_ENDPOINT_URL: ${S3_EXTERNAL_ENDPOINT_URL:-}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-docubot-documents}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev_jwt_secret_key_for_local_testing_only_32bytes}
      APP_SECRET_KEY: ${APP_SECRET_KEY:-dev_app_secret_key_for_local_testing_only_32bytes}
      FERNET_KEY: ${FERNET_KEY:-YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=}
      CHATBOT_RAG_URL: ${CHATBOT_RAG_URL:-http://host.docker.internal:8000}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-local_development_internal_api_key}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      BACKEND_URL: ${BACKEND_URL:-http://localhost:8001}
      MAIL_USERNAME: ${MAIL_USERNAME:-amenawajiha2004@gmail.com}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-hcfqsbvxxmkzqdrb}
      MAIL_FROM: ${MAIL_FROM:-amenawajiha2004@gmail.com}
      MAIL_SERVER: ${MAIL_SERVER:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-true}
      MAIL_SUPPRESS_SEND: ${MAIL_SUPPRESS_SEND:-false}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      minio:
        condition: service_healthy
    networks:
      - dev-network

  postgres:
    image: postgres:15-alpine
    # container_name: docubot-postgres-dev (Namespaced by COMPOSE_PROJECT_NAME)
    restart: always
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    env_file:
      - path: ./docubot-backend/.env
        required: false
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-docubot}
      POSTGRES_USER: ${POSTGRES_USER:-docubot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dev-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-docubot}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    # container_name: docubot-redis-dev (Namespaced by COMPOSE_PROJECT_NAME)
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - dev-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    # container_name: docubot-minio-dev (Namespaced by COMPOSE_PROJECT_NAME)
    restart: always
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    command: server /data --console-address ":9001"
    env_file:
      - path: ./docubot-backend/.env
        required: false
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    networks:
      - dev-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  qdrant:
    image: qdrant/qdrant:v1.17.1
    # container_name: docubot-qdrant-dev (Namespaced by COMPOSE_PROJECT_NAME)
    restart: always
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - dev-network

volumes:
  postgres_data:
  minio_data:
  qdrant_storage:
  redis_data:

networks:
  dev-network:
    driver: bridge
