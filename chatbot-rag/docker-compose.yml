services:
  # Backend API Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - RELOAD=false
      - QDRANT_HOST=http://qdrant
      - QDRANT_PORT=6333
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - WEBSITE_BACKEND_URL=http://backend:8001
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - dev-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      start_period: 90s
      interval: 15s
      timeout: 5s
      retries: 3

  # Celery Ingestion Worker
  celery:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: uv run celery -A src.celery_app worker --loglevel=info
    env_file:
      - .env
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - QDRANT_HOST=http://qdrant
      - QDRANT_PORT=6333
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - WEBSITE_BACKEND_URL=http://backend:8001
    restart: unless-stopped
    networks:
      - dev-network
    depends_on:
      - backend

networks:
  dev-network:
    name: docubot-platform-dev_dev-network
    external: true
