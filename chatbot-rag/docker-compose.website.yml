name: docubot-rag-website

services:
  # RAG FastAPI Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "${CHATBOT_RAG_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - RELOAD=false
      - QDRANT_HOST=${QDRANT_HOST:-qdrant}
      - QDRANT_PORT=${QDRANT_PORT:-6333}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/0}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - WEBSITE_BACKEND_URL=${WEBSITE_BACKEND_URL:-http://backend:8001}
    restart: unless-stopped
    networks:
      - website-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      start_period: 40s
      interval: 15s
      timeout: 5s
      retries: 3

  # Celery Ingestion Worker
  celery:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: uv run celery -A src.celery_app worker --loglevel=info
    env_file:
      - .env
    environment:
      - QDRANT_HOST=${QDRANT_HOST:-qdrant}
      - QDRANT_PORT=${QDRANT_PORT:-6333}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/0}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - WEBSITE_BACKEND_URL=${WEBSITE_BACKEND_URL:-http://backend:8001}
    restart: unless-stopped
    networks:
      - website-network
    depends_on:
      - backend

networks:
  website-network:
    name: ${WEBSITE_NETWORK:-docubot-platform-dev_dev-network}
    