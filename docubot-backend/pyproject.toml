[project]
name = "docubot-backend"
version = "0.1.0"
description = "DocuBot — Multi-tenant RAG chatbot builder backend"
requires-python = ">=3.12"

dependencies = [
    # Web framework
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    # Auth / Security
    "python-jose[cryptography]>=3.3.0",
    "passlib[argon2]>=1.7.4",
    "cryptography>=42.0.0",           # Fernet for API key encryption
    # Config
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
    # Cache
    "redis[hiredis]>=5.0.0",
    # Rate limiting
    "slowapi>=0.1.9",
    # Email (verification / password reset)
    "fastapi-mail>=1.4.1",
    # Validation helpers
    "email-validator>=2.1.0",
    "python-slugify>=8.0.0",
    # MX record check for email deliverability
    "dnspython>=2.6.0",
    # OAuth (Google + GitHub)
    "authlib>=1.3.0",
    "google-auth>=2.20.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "aioboto3>=12.0.0",
    "celery>=5.3.0",
    "qdrant-client[http]>=1.7.0",
    "python-multipart>=0.0.9",
    "websockets>=12.0",
    "groq>=0.11.0",
    "edge-tts>=6.1.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "factory-boy>=3.3.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pytest-cov>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
env = ["TEST_DATABASE_URL="]

[tool.coverage.run]
source = ["src/app"]
omit = ["*/tests/*", "*/__init__.py/*"]

[tool.coveragee.report]
fail_under = 70
show_missing = true
